name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      - name: Swift version
        run: swift --version

      - name: Build
        run: swift build

      - name: Test
        run: swift test

      # The app draws its own previews and icon, so the README images come from the real code.
      - name: Render previews
        run: |
          mkdir -p out
          bin="$(swift build --show-bin-path)/Relay"
          "$bin" --render-preview out/preview-dark.png
          "$bin" --render-preview out/preview-light.png --light
          "$bin" --render-preview out/preview-high.png --high
          "$bin" --render-icon out/icon.png

      - uses: actions/upload-artifact@v4
        with:
          name: previews
          path: out/*.png
