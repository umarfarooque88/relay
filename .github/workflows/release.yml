name: Release

# Runs only when a version tag is pushed (git tag v1.0 && git push origin v1.0).
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      - name: Build Relay.app
        run: ./build.sh

      # The app draws its own previews, so the screenshots come from the real code.
      - name: Render screenshots
        continue-on-error: true
        run: |
          bin=build/Relay.app/Contents/MacOS/Relay
          "$bin" --render-preview build/preview-dark.png
          "$bin" --render-preview build/preview-light.png --light
          "$bin" --render-preview build/preview-high.png --high
          "$bin" --render-icon build/icon.png

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" build/Relay-*.zip build/*.png \
            --title "Relay $GITHUB_REF_NAME" --notes-file .github/release-notes.md
